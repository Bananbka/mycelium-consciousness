server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/* -> the compose `nginx` gateway (least_conn over the API replicas),
    # prefix stripped. Variable + resolver so the upstream is re-resolved
    # instead of pinned at startup.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway http://nginx:80;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
