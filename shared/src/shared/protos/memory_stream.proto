syntax = "proto3";

package memory_stream;

service MemoryStream {
  rpc StreamMemories(stream MemoryFrame) returns (IngestionSummary);
}

message MemoryFrame {
  string clone_id = 1;
  int64 captured_at_unix_ms = 2;
  bytes payload = 3;
}

message IngestionSummary {
  string clone_id = 1;
  uint64 frames_received = 2;
  uint64 bytes_received = 3;
}
