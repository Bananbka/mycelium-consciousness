apiVersion: v1
kind: Service
metadata:
  name: {{ include "clone-factory.componentName" (dict "ctx" . "component" "minio") }}
  labels:
    {{- include "clone-factory.labels" (dict "ctx" . "component" "minio") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "clone-factory.selectorLabels" (dict "ctx" . "component" "minio") | nindent 4 }}
  ports:
    - name: s3
      port: {{ .Values.minio.service.port }}
      targetPort: s3
    - name: console
      port: {{ .Values.minio.service.consolePort }}
      targetPort: console
