{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clone-factory.secretName" . }}
  labels:
    {{- include "clone-factory.labels" (dict "ctx" . "component" "config") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secret.postgresPassword is required: pass it with --set (or use secret.existingSecret)" .Values.secret.postgresPassword | quote }}
  MINIO_ACCESS_KEY: {{ required "secret.minioAccessKey is required: pass it with --set (or use secret.existingSecret)" .Values.secret.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ required "secret.minioSecretKey is required: pass it with --set (or use secret.existingSecret)" .Values.secret.minioSecretKey | quote }}
  JWT_SECRET_KEY: {{ required "secret.jwtSecretKey is required: pass it with --set (or use secret.existingSecret)" .Values.secret.jwtSecretKey | quote }}
{{- end }}
