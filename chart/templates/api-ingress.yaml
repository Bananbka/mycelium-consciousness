{{- if .Values.api.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "clone-factory.componentName" (dict "ctx" . "component" "api") }}
  labels:
    {{- include "clone-factory.labels" (dict "ctx" . "component" "api") | nindent 4 }}
  {{- with .Values.api.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.api.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "clone-factory.componentName" (dict "ctx" . "component" "api") }}
                port:
                  name: http
      {{- with .Values.api.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
