{{- if .Values.redis.persistence.enabled }}
{{- $name := include "clone-factory.componentName" (dict "ctx" . "component" "redis") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- include "clone-factory.labels" (dict "ctx" . "component" "redis") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.redis.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
{{- end }}
