apiVersion: v1
kind: Service
metadata:
  name: {{ include "clone-factory.componentName" (dict "ctx" . "component" "redis") }}
  labels:
    {{- include "clone-factory.labels" (dict "ctx" . "component" "redis") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "clone-factory.selectorLabels" (dict "ctx" . "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: redis
