# Development: the same as the chart defaults, spelled out so that
# `diff values-dev.yaml values-prod.yaml` shows every difference between the
# two environments. Local minikube, locally built images, no Ingress.
api:
  replicas: 2
  image:
    tag: "1.0.0"
  ingress:
    enabled: false
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {cpu: 500m, memory: 512Mi}

celeryWorker:
  replicas: 1
  image:
    tag: "1.0.0"
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {cpu: 500m, memory: 512Mi}

celeryBeat:
  image:
    tag: "1.0.0"

config:
  LOG_LEVEL: INFO
  API_WORKERS: 1
