# Lab 6. Replaces the image's generated pg_hba.conf (loaded via -c hba_file) so
# it applies to an existing data directory too, not only to a fresh initdb.
#
# TYPE  DATABASE     USER  ADDRESS      METHOD
local   all          all                trust
host    all          all   127.0.0.1/32 trust
host    all          all   ::1/128      trust
# Streaming replication: the special "replication" keyword is NOT matched by
# "all", so without this line a standby's pg_basebackup / WAL receiver is
# refused even though the same user can log in normally.
host    replication  all   all          scram-sha-256
host    all          all   all          scram-sha-256
