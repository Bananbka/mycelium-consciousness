global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    # `api` resolves to one A record per replica; each becomes its own target.
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
        refresh_interval: 10s
    metrics_path: /metrics

  - job_name: nginx
    static_configs:
      - targets: [nginx-exporter:9113]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: containers
    static_configs:
      - targets: [stats-exporter:9200]
