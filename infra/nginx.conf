events {}

http {
    upstream admin_api {
        server api:8000;
    }

    upstream grpc_ingester {
        server grpc-ingester:50051;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://admin_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /grpc {
            grpc_pass grpc://grpc_ingester;
        }
    }
}
