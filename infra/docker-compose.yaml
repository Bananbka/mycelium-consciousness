services:
  nginx:
    image: nginx:1.27-alpine
    container_name: clone_nginx
    restart: always
    depends_on:
      - api
      - grpc-ingester
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  api:
    build:
      context: ..
      dockerfile: services/api/src/api/Dockerfile.api
    container_name: clone_api
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "${API_PORT:-8000}:8000"

  grpc-ingester:
    build:
      context: ..
      dockerfile: services/grpc_ingester/src/grpc_ingester/Dockerfile.grpc
    container_name: clone_grpc_ingester
    restart: always
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      - "${GRPC_PORT:-50051}:50051"

  celery-worker:
    build:
      context: ..
      dockerfile: services/celery/src/Dockerfile.celery
    container_name: clone_celery_worker
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: ankane/pgvector:latest
    container_name: clone_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-clone_memory_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: clone_redis
    restart: always
    env_file:
      - .env
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  postgres_data:
