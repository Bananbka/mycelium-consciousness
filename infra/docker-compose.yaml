services:
  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - api
      - grpc-ingester
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  migrate:
    build:
      context: ..
      dockerfile: services/api/src/api/Dockerfile.api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    command:
      - uv
      - run
      - --package
      - api
      - --frozen
      - --no-sync
      - alembic
      - -c
      - shared/alembic.ini
      - upgrade
      - head
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: services/api/src/api/Dockerfile.api
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"

  grpc-ingester:
    build:
      context: ..
      dockerfile: services/grpc_ingester/src/grpc_ingester/Dockerfile.grpc
    restart: always
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "50051"

  celery-worker:
    build:
      context: ..
      dockerfile: services/celery/src/Dockerfile.celery
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db:
    image: pgvector/pgvector:pg16
    container_name: clone_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-clone_memory_db}
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-clone_memory_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: clone_redis
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

volumes:
  postgres_data:
