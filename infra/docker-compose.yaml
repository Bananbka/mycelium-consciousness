name: clone-${APP_ENV:-sandbox}

x-env-file: &env_file
  - ${ENV_FILE:-.env}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    environment:
      # Empty LB_ALGORITHM = round robin. Others: "least_conn;", "ip_hash;".
      # Weights go on the LB_SERVERS line, e.g. "server api:8000 weight=3;".
      LB_ALGORITHM: "${LB_ALGORITHM-}"
      LB_SERVERS: "${LB_SERVERS-server api:8000 max_fails=2 fail_timeout=10s;}"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

  frontend:
    build:
      context: ../frontend
    restart: always
    depends_on:
      - nginx
    networks: [edge]
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"

  migrate:
    build:
      context: ..
      dockerfile: services/api/src/api/Dockerfile.api
      target: runtime
    env_file: *env_file
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    networks: [backend]
    command:
      - alembic
      - -c
      - shared/alembic.ini
      - upgrade
      - head
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: services/api/src/api/Dockerfile.api
      target: runtime
    restart: always
    env_file: *env_file
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [edge, backend]
    environment:
      # Redis read-through caches (seconds, 0 = off). See docs/optimization-report.md.
      AUTH_CACHE_TTL_SECONDS: "${AUTH_CACHE_TTL_SECONDS:-30}"
      BACKUPS_CACHE_TTL_SECONDS: "${BACKUPS_CACHE_TTL_SECONDS:-30}"
    # Horizontal scaling: N identical replicas behind nginx (`api` resolves to
    # all of them). No host port is published, so clients can only reach the
    # pool through the balancer. Override with API_REPLICAS or `--scale api=N`.
    deploy:
      replicas: ${API_REPLICAS:-3}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Lab 6 experiment: same image as `api`, artificially slow. Only started with
  # `--profile slow`; nginx routes to it only if LB_SERVERS names it.
  api-slow:
    extends:
      service: api
    profiles: ["slow"]
    deploy:
      replicas: 1
    environment:
      SIMULATED_LATENCY_MS: "${SLOW_LATENCY_MS:-300}"

  celery-worker:
    build:
      context: ..
      dockerfile: services/celery/src/Dockerfile.celery
      target: runtime
    restart: always
    env_file: *env_file
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-beat:
    build:
      context: ..
      dockerfile: services/celery/src/Dockerfile.celery
      target: runtime
    restart: always
    env_file: *env_file
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - celery
      - -A
      - celery_worker.app
      - beat
      - --loglevel=INFO

  db:
    image: postgres:16-alpine
    restart: always
    env_file: *env_file
    networks: [backend]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec
    env_file: *env_file
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    networks: [backend]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_HOST_PORT:-19001}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - minio_data:/data

networks:
  edge:
  backend:

volumes:
  postgres_data:
  redis_data:
  minio_data:
