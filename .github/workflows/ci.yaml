name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install workspace
        run: uv sync --all-packages --dev --group test --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Verify lockfile is current
        run: uv lock --check

  # One independent job per service: build (package) then test. Tests live in
  # tests/ at the workspace root, so each service runs its own slice of them.
  build-test:
    name: build-test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            package: api
            pytest_args: >-
              tests
              --ignore=tests/test_memory_rollup.py
              --ignore=tests/test_stream_flush.py
          - service: celery
            package: celery-worker
            pytest_args: tests/test_memory_rollup.py tests/test_stream_flush.py
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: clone_memory_db
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: clone_memory_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do
            curl -fs http://localhost:9000/minio/health/ready && exit 0
            sleep 1
          done
          docker logs minio
          exit 1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install workspace
        run: uv sync --all-packages --dev --group test --frozen

      - name: Build ${{ matrix.package }} package
        run: uv build --package ${{ matrix.package }}

      - name: Apply migrations, then verify they match the ORM models
        run: |
          uv run alembic -c shared/alembic.ini upgrade head
          uv run alembic -c shared/alembic.ini check

      - name: Tests
        run: uv run pytest ${{ matrix.pytest_args }}
        env:
          CELERY_BROKER_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-only-signing-key-not-a-placeholder-0123456789abcdef
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: clone-ci-test

  docker:
    name: docker (${{ matrix.service }})
    needs: [lint, build-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: services/api/src/api/Dockerfile.api
          - service: celery
            dockerfile: services/celery/src/Dockerfile.celery
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Built into the runner's local daemon only; nothing is published here.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # Runs only for pushes to main, after every image built and passed the scan.
  # The build reuses the layer cache the docker job just wrote.
  publish:
    name: publish (${{ matrix.service }})
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: services/api/src/api/Dockerfile.api
          - service: celery
            dockerfile: services/celery/src/Dockerfile.celery
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
