[project]
name = "memory_sync_project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["services/*", "shared"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.8",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py", "*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["api", "celery_worker", "grpc_ingester", "shared"]

[tool.ruff.lint.per-file-ignores]
"shared/migrations/versions/*" = ["E501"]
