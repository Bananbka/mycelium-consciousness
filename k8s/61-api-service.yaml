apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: clone-factory
  labels:
    app.kubernetes.io/name: clone-factory
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: clone-factory
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
