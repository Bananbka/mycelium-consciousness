apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: clone-factory
  labels:
    app.kubernetes.io/name: clone-factory
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clone-factory
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
