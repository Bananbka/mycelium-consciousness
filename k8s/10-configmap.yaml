apiVersion: v1
kind: ConfigMap
metadata:
  name: clone-config
  namespace: clone-factory
  labels:
    app.kubernetes.io/name: clone-factory
    app.kubernetes.io/component: config
data:
  # PostgreSQL
  POSTGRES_USER: admin
  POSTGRES_DB: clone_memory_db
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "2"
  DB_POOL_RECYCLE: "1800"

  # Redis / Celery
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  CELERY_TASK_QUEUE: memory_batches
  ROLLUP_CHECK_INTERVAL_SECONDS: "3600"
  STREAM_FLUSH_INTERVAL_SECONDS: "60"
  MEMORY_STREAM_MAXLEN: "10000"

  # Object storage
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: memory-backups

  # Auth
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_TTL_MINUTES: "60"

  # API
  API_HOST: 0.0.0.0
  API_PORT: "8000"
  API_WORKERS: "1"
  API_RELOAD: "false"
  LOG_LEVEL: INFO
