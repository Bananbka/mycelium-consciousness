apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: clone-factory
  labels:
    app.kubernetes.io/name: clone-factory
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clone-factory
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo waiting for postgres; sleep 2; done
          envFrom:
            - configMapRef:
                name: clone-config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: migrate
          image: clone-api:1.0.0
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - uv
            - run
            - --package
            - api
            - --frozen
            - --no-sync
            - alembic
            - -c
            - shared/alembic.ini
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: clone-config
            - secretRef:
                name: clone-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
