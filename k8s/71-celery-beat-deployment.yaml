apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: clone-factory
  labels:
    app.kubernetes.io/name: clone-factory
    app.kubernetes.io/component: celery-beat
spec:
  # Exactly one scheduler: a second replica would enqueue every task twice.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: clone-factory
      app.kubernetes.io/component: celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clone-factory
        app.kubernetes.io/component: celery-beat
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-migrations
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM alembic_version" 2>/dev/null | grep -q '^[1-9]'; do echo waiting for migrations; sleep 3; done
          envFrom:
            - configMapRef:
                name: clone-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: clone-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: celery-beat
          image: clone-celery:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - --package
            - celery-worker
            - --frozen
            - --no-sync
            - celery
            - -A
            - celery_worker.app
            - beat
            - --loglevel=INFO
          envFrom:
            - configMapRef:
                name: clone-config
            - secretRef:
                name: clone-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
