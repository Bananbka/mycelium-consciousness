# Single entry point for three identical instances of the application.
events {}

http {
    # which upstream nginx used and what it answered (see `docker logs lb-nginx`)
    log_format lb '$remote_addr "$request" $status upstream=$upstream_addr '
                  'upstream_status=$upstream_status rt=$request_time';
    access_log /dev/stdout lb;

    upstream mycelium {
        # round robin by default; try `least_conn;` for uneven request cost
        server app1:8080 max_fails=2 fail_timeout=10s;
        server app2:8080 max_fails=2 fail_timeout=10s;
        server app3:8080 max_fails=2 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://mycelium;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Passive health checking: an instance that refuses connections or times
            # out is skipped for fail_timeout, and the request goes to the next one.
            # (Open-source nginx has no active probes; /health is used by Docker.)
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;

            add_header X-Upstream $upstream_addr always;
        }

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
